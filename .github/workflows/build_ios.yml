name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project AwisApp.xcodeproj \
            -scheme AwisApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AwisApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AwisApp.xcarchive/Products/Applications/AwisApp.app build/Payload/
          cd build && zip -qr AwisApp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwisApp-v1.71-iOS
          path: build/AwisApp.ipa
          retention-days: 14
