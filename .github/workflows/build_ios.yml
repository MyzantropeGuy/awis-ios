name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app
          fi
          echo "Selected Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Fix XcodeGen format 77 incompatibility with Xcode 15.4
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' AwisApp.xcodeproj/project.pbxproj
          echo "Fixed objectVersion in project.pbxproj:"
          grep "objectVersion" AwisApp.xcodeproj/project.pbxproj
          xcodebuild -project AwisApp.xcodeproj -list

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project AwisApp.xcodeproj \
            -scheme AwisApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Payload into IPA
        run: |
          echo "=== Searching for compiled .app bundle ==="
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find any .app bundle in build output!"
            find build/Build/Products -maxdepth 4
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          echo "=== Contents of $APP_PATH ==="
          ls -la "$APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr AwisApp.ipa Payload/

          echo "=== Generated IPA Details ==="
          ls -lh AwisApp.ipa
          unzip -l AwisApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwisApp-v1.71-iOS
          path: AwisApp.ipa
          retention-days: 14
