name: AwisApp
options:
  bundleIdPrefix: ua.novaposhta
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: '15.4'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ua.novaposhta.awis
    MARKETING_VERSION: "1.71"
    CURRENT_PROJECT_VERSION: "71"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: ""
targets:
  AwisApp:
    type: application
    platform: iOS
    sources:
      - path: AwisApp/Sources
    info:
      path: AwisApp/Info.plist
    settings:
      base:
        INFOPLIST_FILE: AwisApp/Info.plist
        PRODUCT_NAME: AWIS
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: "Manual"
        DEVELOPMENT_TEAM: ""
